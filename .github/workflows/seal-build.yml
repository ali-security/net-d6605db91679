# Upstream golang.org/x/net ships no GitHub Actions CI (it is developed on
# Gerrit and tested by the Go project's own TryBots), so this workflow was
# authored for the sealed build. It reproduces what the project's own tooling
# does: package the module zip exactly as proxy.golang.org publishes it, then
# run the repository's real suite with `go build ./...` and `go test ./...`.
name: seal-build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Show toolchain
        run: go version

      - name: Build the module-zip helper
        run: |
          set -euxo pipefail
          HELPER="$(mktemp -d)"
          cp "$GITHUB_WORKSPACE/.github/create_mod.go" "$HELPER/"
          cd "$HELPER"
          go mod init example.com/mod
          go get golang.org/x/mod@v0.24.0
          go build -o "$RUNNER_TEMP/create_mod" ./create_mod.go

      - name: Remove sealed-build scaffolding before packaging
        run: rm -rf "$GITHUB_WORKSPACE/.github"

      - name: Create the module zip
        run: |
          set -euxo pipefail
          mkdir -p "$RUNNER_TEMP/out"
          "$RUNNER_TEMP/create_mod" golang.org/x/net v0.45.0 "$GITHUB_WORKSPACE" "$RUNNER_TEMP/out/v0.45.0.zip"
          ls -l "$RUNNER_TEMP/out"

      - name: Upload the module zip
        uses: actions/upload-artifact@v4
        with:
          name: module-zip
          path: ${{ runner.temp }}/out/v0.45.0.zip
          if-no-files-found: error

      - name: Build all packages
        run: go build ./...

      - name: Run the test suite
        run: go test ./...
